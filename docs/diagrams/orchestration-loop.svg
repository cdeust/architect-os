<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 446" width="980" height="446" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">One step of the orchestration loop</title>
  <desc id="d">A brief is written by the orchestrator. Scouts, read-only sessions on a small model, each answer one question by quoting lines of the repository, and the host keeps only the quotations it finds at those lines. A build session in a sandbox gets the brief and the checked quotations. The host reads the diff and runs what the sandbox cannot. The reviews of the step, each a read-only session in its own sandbox and on its own model, run at the same time and each return a verdict. The gate runs the scenarios and the mutation, and the host commits and delivers the same commit to the branch and then to main, both held by a ruleset. A refusal becomes a new brief that names the findings.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="979" height="445" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328">One step of the orchestration loop</text>
  <text x="24" y="54" font-size="12.5" fill="#57606a">npm run step -- &lt;folder&gt; plays the sessions (2, 3 and 5) from step.json and its briefs, and keeps their files; the rest is the host's</text>

  <g font-size="11.5" fill="#1f2328">
    <rect x="20" y="86" width="122" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="81" y="110" text-anchor="middle" font-weight="600" font-size="13">1 · Brief</text>
    <text x="81" y="131" text-anchor="middle" fill="#57606a">written by the</text>
    <text x="81" y="146" text-anchor="middle" fill="#57606a">orchestrator, given</text>
    <text x="81" y="161" text-anchor="middle" fill="#57606a">on stdin: only</text>
    <text x="81" y="176" text-anchor="middle" fill="#57606a">what this step</text>
    <text x="81" y="191" text-anchor="middle" fill="#57606a">needs</text>
    <rect x="157" y="86" width="122" height="132" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="218" y="110" text-anchor="middle" font-weight="600" font-size="13">2 · Scouts</text>
    <text x="218" y="131" text-anchor="middle" fill="#57606a">small model, read-</text>
    <text x="218" y="146" text-anchor="middle" fill="#57606a">only srt; one</text>
    <text x="218" y="161" text-anchor="middle" fill="#57606a">question each;</text>
    <text x="218" y="176" text-anchor="middle" fill="#57606a">they quote lines of</text>
    <text x="218" y="191" text-anchor="middle" fill="#57606a">the repository</text>
    <rect x="294" y="86" width="122" height="132" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="355" y="110" text-anchor="middle" font-weight="600" font-size="13">3 · Build</text>
    <text x="355" y="131" text-anchor="middle" fill="#57606a">Claude Code in srt,</text>
    <text x="355" y="146" text-anchor="middle" fill="#57606a">profile builder:</text>
    <text x="355" y="161" text-anchor="middle" fill="#57606a">writes its worktree;</text>
    <text x="355" y="176" text-anchor="middle" fill="#57606a">gets the brief and</text>
    <text x="355" y="191" text-anchor="middle" fill="#57606a">the checked quotes</text>
    <rect x="431" y="86" width="122" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="492" y="110" text-anchor="middle" font-weight="600" font-size="13">4 · Replay</text>
    <text x="492" y="131" text-anchor="middle" fill="#57606a">the host reads the</text>
    <text x="492" y="146" text-anchor="middle" fill="#57606a">diff and runs what</text>
    <text x="492" y="161" text-anchor="middle" fill="#57606a">the sandbox cannot:</text>
    <text x="492" y="176" text-anchor="middle" fill="#57606a">real srt, Postgres,</text>
    <text x="492" y="191" text-anchor="middle" fill="#57606a">mutation</text>
    <rect x="568" y="86" width="122" height="132" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="629" y="110" text-anchor="middle" font-weight="600" font-size="13">5 · Reviews</text>
    <text x="629" y="131" text-anchor="middle" fill="#57606a">several at once,</text>
    <text x="629" y="146" text-anchor="middle" fill="#57606a">each in its srt and</text>
    <text x="629" y="161" text-anchor="middle" fill="#57606a">on its model; read,</text>
    <text x="629" y="176" text-anchor="middle" fill="#57606a">cannot write; verdict</text>
    <text x="629" y="191" text-anchor="middle" fill="#57606a">against a contract</text>
    <rect x="705" y="86" width="122" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="766" y="110" text-anchor="middle" font-weight="600" font-size="13">6 · Gate</text>
    <text x="766" y="131" text-anchor="middle" fill="#57606a">every scenario run,</text>
    <text x="766" y="146" text-anchor="middle" fill="#57606a">count = base</text>
    <text x="766" y="161" text-anchor="middle" fill="#57606a">+ added − removed;</text>
    <text x="766" y="176" text-anchor="middle" fill="#57606a">0 surviving mutant</text>
    <text x="766" y="191" text-anchor="middle" fill="#57606a">on changed lines</text>
    <rect x="842" y="86" width="122" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="903" y="110" text-anchor="middle" font-weight="600" font-size="13">7 · Delivery</text>
    <text x="903" y="131" text-anchor="middle" fill="#57606a">commit by the host</text>
    <text x="903" y="146" text-anchor="middle" fill="#57606a">only; the same</text>
    <text x="903" y="161" text-anchor="middle" fill="#57606a">commit to the</text>
    <text x="903" y="176" text-anchor="middle" fill="#57606a">branch, then main,</text>
    <text x="903" y="191" text-anchor="middle" fill="#57606a">a ruleset on both</text>
  </g>

  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M142 152H155"/><path d="M279 152H292"/><path d="M416 152H429"/><path d="M553 152H566"/><path d="M690 152H703"/><path d="M827 152H840"/>
  </g>

  <!-- refusal loop -->
  <g stroke="#cf222e" stroke-width="1.6" fill="none">
    <path d="M629 218V262H81V220" marker-end="url(#r)"/>
    <path d="M766 218V262H629"/>
  </g>
  <rect x="196" y="250" width="268" height="24" rx="12" fill="#ffffff" stroke="#cf222e"/>
  <text x="330" y="266" text-anchor="middle" font-size="12" fill="#cf222e">refused: a new brief names the findings</text>

  <!-- kept -->
  <rect x="20" y="302" width="940" height="68" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="36" y="323" font-size="12.5" font-weight="600" fill="#1f2328">Left in the step folder, for every step</text>
  <text x="36" y="342" font-size="12" fill="#57606a">every session stream · measures read from it (answers, tokens, cache, cost, cost by model) · the quotes of each scout, checked or rejected with</text>
  <text x="36" y="358" font-size="12" fill="#57606a">the reason · the brief the build received · the build report · one verdict per review · exit code 0, 1 or 2</text>

  <!-- legend -->
  <rect x="20" y="396" width="16" height="16" rx="3" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="44" y="409" font-size="12" fill="#57606a">on the host</text>
  <rect x="150" y="396" width="16" height="16" rx="3" fill="#fff8e1" stroke="#bf8700"/>
  <text x="174" y="409" font-size="12" fill="#57606a">inside an srt sandbox, one per session, destroyed at the end</text>
</svg>
