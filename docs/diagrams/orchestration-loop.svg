    <rect x="650" y="77" width="36" height="16" rx="8" fill="#ddf4ff" stroke="#218bff"/><text x="668" y="88.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#0969da">next</text>
    <text x="668" y="110" text-anchor="middle" font-weight="600" font-size="12" fill="#1f2328">By dimension</text>
    <text x="668" y="126" text-anchor="middle">one grid each; a</text>
