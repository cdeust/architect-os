    <text x="73" y="139" text-anchor="middle">score; a spec, a</text>
    <text x="73" y="152" text-anchor="middle">plan; a human</text>
    <text x="73" y="165" text-anchor="middle">signs each</text>
    <rect x="258" y="70" width="106" height="100" rx="8" fill="#ffffff" stroke="#218bff" stroke-dasharray="5 4"/>
    <rect x="293" y="77" width="36" height="16" rx="8" fill="#ddf4ff" stroke="#218bff"/><text x="311" y="88.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#0969da">next</text>
    <text x="311" y="110" text-anchor="middle" font-weight="600" font-size="12" fill="#1f2328">Scenarios apart</text>
    <text x="311" y="126" text-anchor="middle">written by another</text>
    <text x="311" y="139" text-anchor="middle">session, frozen</text>
