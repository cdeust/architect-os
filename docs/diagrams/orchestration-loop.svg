  <g stroke="#cf222e" stroke-width="1.6" fill="none">
    <path d="M668 324V368H73V326" marker-end="url(#r)"/>
    <path d="M787 324V368H668"/>
    <path d="M430 324V368"/>
  </g>
  <rect x="112" y="356" width="252" height="24" rx="12" fill="#ffffff" stroke="#cf222e"/>
  <text x="238" y="372" text-anchor="middle" font-size="12" fill="#cf222e">refused: a new brief names what failed</text>

  <!-- kept -->
  <rect x="20" y="408" width="940" height="84" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="36" y="429" font-size="12.5" font-weight="600" fill="#1f2328">Left in the step folder, on the host, for every step</text>
  <text x="36" y="448" font-size="12" fill="#57606a">every session stream · measures read from it (answers, tokens, cache, cost, cost by model) · the quotes of each scout, checked or rejected with</text>
  <text x="36" y="464" font-size="12" fill="#57606a">the reason · the brief the build received · the build report · each check: its command, exit code, duration and the end of its output ·</text>
  <text x="36" y="480" font-size="12" fill="#57606a">the brief the reviews received · one verdict per review · exit code 0, 1 or 2</text>

  <!-- published -->
  <rect x="20" y="500" width="940" height="72" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="36" y="521" font-size="12.5" font-weight="600" fill="#1f2328">Written by the host into steps/&lt;name&gt;/ of the worktree, and committed with the code</text>
  <text x="36" y="540" font-size="12" fill="#57606a">the brief, the step file and the questions as read at the start · a record: the tree the step saw, a hash of each input and of the launcher, costs, verdicts</text>
  <rect x="36" y="549" width="36" height="16" rx="8" fill="#ddf4ff" stroke="#218bff"/><text x="54" y="560.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#0969da">next</text>
  <text x="80" y="562" font-size="12" fill="#57606a">one commit per pass on a work branch: a pass that starts from a modified tree cannot be replayed from the repository alone</text>

  <!-- legend -->
  <rect x="20" y="598" width="16" height="16" rx="3" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="44" y="611" font-size="12" fill="#57606a">on the host</text>
  <rect x="150" y="598" width="16" height="16" rx="3" fill="#fff8e1" stroke="#bf8700"/>
  <text x="174" y="611" font-size="12" fill="#57606a">inside an srt sandbox, one per session or command, destroyed at the end</text>
  <rect x="640" y="598" width="36" height="16" rx="8" fill="#ddf4ff" stroke="#218bff"/><text x="658" y="609.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#0969da">next</text>
  <text x="684" y="611" font-size="12" fill="#57606a">decided or designed, not built yet</text>
