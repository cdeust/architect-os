  <g font-size="11" fill="#1f2328">
    <rect x="20" y="192" width="106" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="73" y="216" text-anchor="middle" font-weight="600" font-size="13">1 · Brief</text>
    <text x="73" y="237" text-anchor="middle" fill="#57606a">written by the</text>
    <text x="73" y="252" text-anchor="middle" fill="#57606a">orchestrator,</text>
    <text x="73" y="267" text-anchor="middle" fill="#57606a">given on stdin:</text>
    <text x="73" y="282" text-anchor="middle" fill="#57606a">only what this</text>
    <text x="73" y="297" text-anchor="middle" fill="#57606a">step needs</text>
    <rect x="139" y="192" width="106" height="132" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="192" y="216" text-anchor="middle" font-weight="600" font-size="13">2 · Scouts</text>
    <text x="192" y="237" text-anchor="middle" fill="#57606a">small model,</text>
    <text x="192" y="252" text-anchor="middle" fill="#57606a">read-only srt;</text>
    <text x="192" y="267" text-anchor="middle" fill="#57606a">one question</text>
    <text x="192" y="282" text-anchor="middle" fill="#57606a">each; they quote</text>
    <text x="192" y="297" text-anchor="middle" fill="#57606a">lines of the</text>
    <text x="192" y="312" text-anchor="middle" fill="#57606a">repository</text>
    <rect x="258" y="192" width="106" height="132" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="311" y="216" text-anchor="middle" font-weight="600" font-size="13">3 · Build</text>
    <text x="311" y="237" text-anchor="middle" fill="#57606a">Claude Code in</text>
    <text x="311" y="252" text-anchor="middle" fill="#57606a">srt, profile</text>
    <text x="311" y="267" text-anchor="middle" fill="#57606a">builder: writes</text>
    <text x="311" y="282" text-anchor="middle" fill="#57606a">its worktree, from</text>
    <text x="311" y="297" text-anchor="middle" fill="#57606a">the brief and the</text>
    <text x="311" y="312" text-anchor="middle" fill="#57606a">checked quotes</text>
    <rect x="377" y="192" width="106" height="132" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="430" y="216" text-anchor="middle" font-weight="600" font-size="13">4 · Checks</text>
    <text x="430" y="237" text-anchor="middle" fill="#57606a">commands of the</text>
    <text x="430" y="252" text-anchor="middle" fill="#57606a">step, no model:</text>
    <text x="430" y="267" text-anchor="middle" fill="#57606a">srt, no network,</text>
    <text x="430" y="282" text-anchor="middle" fill="#57606a">read-only; a</text>
    <text x="430" y="297" text-anchor="middle" fill="#57606a">failure stops</text>
    <text x="430" y="312" text-anchor="middle" fill="#57606a">before a review</text>
    <rect x="496" y="192" width="106" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="549" y="216" text-anchor="middle" font-weight="600" font-size="13">5 · Replay</text>
    <text x="549" y="237" text-anchor="middle" fill="#57606a">the host reads</text>
    <text x="549" y="252" text-anchor="middle" fill="#57606a">the diff and runs</text>
    <text x="549" y="267" text-anchor="middle" fill="#57606a">what no sandbox</text>
    <text x="549" y="282" text-anchor="middle" fill="#57606a">can: real srt,</text>
    <text x="549" y="297" text-anchor="middle" fill="#57606a">Postgres,</text>
    <text x="549" y="312" text-anchor="middle" fill="#57606a">mutation</text>
    <rect x="615" y="192" width="106" height="132" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="668" y="216" text-anchor="middle" font-weight="600" font-size="13">6 · Reviews</text>
    <text x="668" y="237" text-anchor="middle" fill="#57606a">several at once,</text>
    <text x="668" y="252" text-anchor="middle" fill="#57606a">each in its srt,</text>
    <text x="668" y="267" text-anchor="middle" fill="#57606a">on its model;</text>
    <text x="668" y="282" text-anchor="middle" fill="#57606a">cannot write; get</text>
    <text x="668" y="297" text-anchor="middle" fill="#57606a">the check results</text>
    <text x="668" y="312" text-anchor="middle" fill="#57606a">and give verdicts</text>
    <rect x="734" y="192" width="106" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="787" y="216" text-anchor="middle" font-weight="600" font-size="13">7 · Gate</text>
    <text x="787" y="237" text-anchor="middle" fill="#57606a">every scenario</text>
    <text x="787" y="252" text-anchor="middle" fill="#57606a">run, count = base</text>
    <text x="787" y="267" text-anchor="middle" fill="#57606a">+ added − removed</text>
    <text x="787" y="282" text-anchor="middle" fill="#57606a">0 surviving</text>
    <text x="787" y="297" text-anchor="middle" fill="#57606a">mutant on changed</text>
    <text x="787" y="312" text-anchor="middle" fill="#57606a">lines</text>
    <rect x="853" y="192" width="106" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="906" y="216" text-anchor="middle" font-weight="600" font-size="13">8 · Delivery</text>
    <text x="906" y="237" text-anchor="middle" fill="#57606a">commit by the</text>
    <text x="906" y="252" text-anchor="middle" fill="#57606a">host only; same</text>
    <text x="906" y="267" text-anchor="middle" fill="#57606a">commit to the</text>
    <text x="906" y="282" text-anchor="middle" fill="#57606a">branch, then</text>
    <text x="906" y="297" text-anchor="middle" fill="#57606a">main; a ruleset</text>
    <text x="906" y="312" text-anchor="middle" fill="#57606a">on both</text>
  </g>

