<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 648" width="980" height="648" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">One step of the orchestration loop</title>
  <desc id="d">A brief is written by the orchestrator. Scouts, read-only sessions on a small model, each answer one question by quoting lines of the repository, and the host keeps only the quotations it finds at those lines. A build session in a sandbox gets the brief and the checked quotations. Then the checks of the step, commands without a model, run one after the other in a sandbox with no network and a read-only worktree; one that fails stops the step before any review. The host reads the diff and runs what the sandbox cannot. The reviews of the step, each a read-only session in its own sandbox and on its own model, run at the same time, receive the results of the checks and each return a verdict. The gate runs the scenarios and the mutation, and the host commits and delivers the same commit to the branch and then to main, both held by a ruleset. A refusal becomes a new brief that names what failed. At the end of a step the host writes into steps/&lt;name&gt;/ of the worktree the brief, the step file and the scout questions as it read them at the start, with a record of the tree the step saw, a hash of each input and of the launcher files, the costs and the verdicts; the builder cannot write there, and the folder is committed with the code. Decided and not built, marked next, each above the phase it joins: Define and Plan with a human signature before the brief; scenarios written by another session and frozen for the build; inputs invented by a fresh session and the mutation of the changed lines, both as phases of the step; one commit per pass on a work branch, so that every pass can be replayed; one review grid per dimension, a finding given with its failing scenario; a reflection that records errors for the next brief; and a human gate at delivery, the orchestrator having an identity of its own and no bypass.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#218bff"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="979" height="647" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328">One step of the orchestration loop</text>
  <text x="24" y="54" font-size="12.5" fill="#57606a">npm run step -- &lt;folder&gt; plays 2, 3, 4 and 6 from step.json and its briefs, and keeps their files; the rest is the host's</text>

