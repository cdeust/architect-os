<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 462" width="980" height="462" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">One step of the orchestration loop</title>
  <desc id="d">A brief is written by the orchestrator. Scouts, read-only sessions on a small model, each answer one question by quoting lines of the repository, and the host keeps only the quotations it finds at those lines. A build session in a sandbox gets the brief and the checked quotations. Then the checks of the step, commands without a model, run one after the other in a sandbox with no network and a read-only worktree; one that fails stops the step before any review. The host reads the diff and runs what the sandbox cannot. The reviews of the step, each a read-only session in its own sandbox and on its own model, run at the same time, receive the results of the checks and each return a verdict. The gate runs the scenarios and the mutation, and the host commits and delivers the same commit to the branch and then to main, both held by a ruleset. A refusal becomes a new brief that names what failed.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="979" height="461" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328">One step of the orchestration loop</text>
  <text x="24" y="54" font-size="12.5" fill="#57606a">npm run step -- &lt;folder&gt; plays 2, 3, 4 and 6 from step.json and its briefs, and keeps their files; the rest is the host's</text>

  <g font-size="11" fill="#1f2328">
    <rect x="20" y="86" width="106" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="73" y="110" text-anchor="middle" font-weight="600" font-size="13">1 · Brief</text>
    <text x="73" y="131" text-anchor="middle" fill="#57606a">written by the</text>
    <text x="73" y="146" text-anchor="middle" fill="#57606a">orchestrator,</text>
    <text x="73" y="161" text-anchor="middle" fill="#57606a">given on stdin:</text>
    <text x="73" y="176" text-anchor="middle" fill="#57606a">only what this</text>
    <text x="73" y="191" text-anchor="middle" fill="#57606a">step needs</text>
    <rect x="139" y="86" width="106" height="132" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="192" y="110" text-anchor="middle" font-weight="600" font-size="13">2 · Scouts</text>
    <text x="192" y="131" text-anchor="middle" fill="#57606a">small model,</text>
    <text x="192" y="146" text-anchor="middle" fill="#57606a">read-only srt;</text>
    <text x="192" y="161" text-anchor="middle" fill="#57606a">one question</text>
    <text x="192" y="176" text-anchor="middle" fill="#57606a">each; they quote</text>
    <text x="192" y="191" text-anchor="middle" fill="#57606a">lines of the</text>
    <text x="192" y="206" text-anchor="middle" fill="#57606a">repository</text>
    <rect x="258" y="86" width="106" height="132" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="311" y="110" text-anchor="middle" font-weight="600" font-size="13">3 · Build</text>
    <text x="311" y="131" text-anchor="middle" fill="#57606a">Claude Code in</text>
    <text x="311" y="146" text-anchor="middle" fill="#57606a">srt, profile</text>
    <text x="311" y="161" text-anchor="middle" fill="#57606a">builder: writes</text>
    <text x="311" y="176" text-anchor="middle" fill="#57606a">its worktree, from</text>
    <text x="311" y="191" text-anchor="middle" fill="#57606a">the brief and the</text>
    <text x="311" y="206" text-anchor="middle" fill="#57606a">checked quotes</text>
    <rect x="377" y="86" width="106" height="132" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="430" y="110" text-anchor="middle" font-weight="600" font-size="13">4 · Checks</text>
    <text x="430" y="131" text-anchor="middle" fill="#57606a">commands of the</text>
    <text x="430" y="146" text-anchor="middle" fill="#57606a">step, no model:</text>
    <text x="430" y="161" text-anchor="middle" fill="#57606a">srt, no network,</text>
    <text x="430" y="176" text-anchor="middle" fill="#57606a">read-only; a</text>
    <text x="430" y="191" text-anchor="middle" fill="#57606a">failure stops</text>
    <text x="430" y="206" text-anchor="middle" fill="#57606a">before a review</text>
    <rect x="496" y="86" width="106" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="549" y="110" text-anchor="middle" font-weight="600" font-size="13">5 · Replay</text>
    <text x="549" y="131" text-anchor="middle" fill="#57606a">the host reads</text>
    <text x="549" y="146" text-anchor="middle" fill="#57606a">the diff and runs</text>
    <text x="549" y="161" text-anchor="middle" fill="#57606a">what no sandbox</text>
    <text x="549" y="176" text-anchor="middle" fill="#57606a">can: real srt,</text>
    <text x="549" y="191" text-anchor="middle" fill="#57606a">Postgres,</text>
    <text x="549" y="206" text-anchor="middle" fill="#57606a">mutation</text>
    <rect x="615" y="86" width="106" height="132" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="668" y="110" text-anchor="middle" font-weight="600" font-size="13">6 · Reviews</text>
    <text x="668" y="131" text-anchor="middle" fill="#57606a">several at once,</text>
    <text x="668" y="146" text-anchor="middle" fill="#57606a">each in its srt,</text>
    <text x="668" y="161" text-anchor="middle" fill="#57606a">on its model;</text>
    <text x="668" y="176" text-anchor="middle" fill="#57606a">cannot write; get</text>
    <text x="668" y="191" text-anchor="middle" fill="#57606a">the check results</text>
    <text x="668" y="206" text-anchor="middle" fill="#57606a">and give verdicts</text>
    <rect x="734" y="86" width="106" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="787" y="110" text-anchor="middle" font-weight="600" font-size="13">7 · Gate</text>
    <text x="787" y="131" text-anchor="middle" fill="#57606a">every scenario</text>
    <text x="787" y="146" text-anchor="middle" fill="#57606a">run, count = base</text>
    <text x="787" y="161" text-anchor="middle" fill="#57606a">+ added − removed</text>
    <text x="787" y="176" text-anchor="middle" fill="#57606a">0 surviving</text>
    <text x="787" y="191" text-anchor="middle" fill="#57606a">mutant on changed</text>
    <text x="787" y="206" text-anchor="middle" fill="#57606a">lines</text>
    <rect x="853" y="86" width="106" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="906" y="110" text-anchor="middle" font-weight="600" font-size="13">8 · Delivery</text>
    <text x="906" y="131" text-anchor="middle" fill="#57606a">commit by the</text>
    <text x="906" y="146" text-anchor="middle" fill="#57606a">host only; same</text>
    <text x="906" y="161" text-anchor="middle" fill="#57606a">commit to the</text>
    <text x="906" y="176" text-anchor="middle" fill="#57606a">branch, then</text>
    <text x="906" y="191" text-anchor="middle" fill="#57606a">main; a ruleset</text>
    <text x="906" y="206" text-anchor="middle" fill="#57606a">on both</text>
  </g>

  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M126 152H137"/><path d="M245 152H256"/><path d="M364 152H375"/><path d="M483 152H494"/><path d="M602 152H613"/><path d="M721 152H732"/><path d="M840 152H851"/>
  </g>

  <!-- refusal loop: a failed check, a review that refuses, a red gate -->
  <g stroke="#cf222e" stroke-width="1.6" fill="none">
    <path d="M668 218V262H73V220" marker-end="url(#r)"/>
    <path d="M787 218V262H668"/>
    <path d="M430 218V262"/>
  </g>
  <rect x="112" y="250" width="252" height="24" rx="12" fill="#ffffff" stroke="#cf222e"/>
  <text x="238" y="266" text-anchor="middle" font-size="12" fill="#cf222e">refused: a new brief names what failed</text>

  <!-- kept -->
  <rect x="20" y="302" width="940" height="84" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="36" y="323" font-size="12.5" font-weight="600" fill="#1f2328">Left in the step folder, for every step</text>
  <text x="36" y="342" font-size="12" fill="#57606a">every session stream · measures read from it (answers, tokens, cache, cost, cost by model) · the quotes of each scout, checked or rejected with</text>
  <text x="36" y="358" font-size="12" fill="#57606a">the reason · the brief the build received · the build report · each check: its command, exit code, duration and the end of its output ·</text>
  <text x="36" y="374" font-size="12" fill="#57606a">the brief the reviews received · one verdict per review · exit code 0, 1 or 2</text>

  <!-- legend -->
  <rect x="20" y="412" width="16" height="16" rx="3" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="44" y="425" font-size="12" fill="#57606a">on the host</text>
  <rect x="150" y="412" width="16" height="16" rx="3" fill="#fff8e1" stroke="#bf8700"/>
  <text x="174" y="425" font-size="12" fill="#57606a">inside an srt sandbox, one per session or command, destroyed at the end</text>
</svg>
