<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 552" width="980" height="552" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">The watch of Anthropic: a source that moved is seen, read and decided</title>
  <desc id="d">A command reads the public sources of Anthropic the platform relies on, from a closed list of hosts, and compares them with a committed register that names each source, the files that rely on it and what was read of it. It prints identifiers, versions, addresses and counts, never the text it read. When a source moved, the maintainer reads what changed, classifies each change, decides, proves a pin move with the gate, and records the reading in the register.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="979" height="551" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328">The watch of Anthropic: a source that moved is seen, read and decided</text>
  <text x="24" y="54" font-size="12.5" fill="#57606a">tools/watch · npm run watch -- check | read · register in tools/watch/watch.json · every Monday in CI</text>

  <!-- sources -->
  <rect x="20" y="72" width="290" height="300" rx="8" fill="#fff8e1" stroke="#bf8700"/>
  <text x="36" y="94" font-size="13" font-weight="600" fill="#1f2328">Anthropic · public, read as untrusted text</text>
  <g font-size="12">
    <rect x="36" y="104" width="258" height="54" rx="6" fill="#ffffff" stroke="#bf8700"/>
    <text x="48" y="124" font-weight="600" fill="#1f2328">2 pinned packages</text>
    <text x="48" y="142" fill="#57606a">Claude Agent SDK, sandbox runtime</text>

    <rect x="36" y="168" width="258" height="54" rx="6" fill="#ffffff" stroke="#bf8700"/>
    <text x="48" y="188" font-weight="600" fill="#1f2328">2 changelogs</text>
    <text x="48" y="206" fill="#57606a">Claude Code, Claude Agent SDK</text>

    <rect x="36" y="232" width="258" height="54" rx="6" fill="#ffffff" stroke="#bf8700"/>
    <text x="48" y="252" font-weight="600" fill="#1f2328">2 documentation indexes</text>
    <text x="48" y="270" fill="#57606a">Claude Code 205 pages, platform 916</text>

    <rect x="36" y="296" width="258" height="64" rx="6" fill="#ffffff" stroke="#bf8700"/>
    <text x="48" y="316" font-weight="600" fill="#1f2328">22 pages</text>
    <text x="48" y="334" fill="#57606a">headless, CLI, settings, Agent SDK,</text>
    <text x="48" y="350" fill="#57606a">Messages API, errors, streaming, models</text>
  </g>

  <!-- check -->
  <rect x="345" y="72" width="290" height="300" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="361" y="94" font-size="13" font-weight="600" fill="#1f2328">Check · code, not a model</text>
  <g font-size="12">
    <rect x="361" y="104" width="258" height="70" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="373" y="124" font-weight="600" fill="#1f2328">Reads</text>
    <text x="373" y="142" fill="#57606a">HTTPS, four hosts in a closed list,</text>
    <text x="373" y="158" fill="#57606a">a time and a size limit per source</text>

    <rect x="361" y="184" width="258" height="86" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="373" y="204" font-weight="600" fill="#1f2328">Compares</text>
    <text x="373" y="222" fill="#57606a">the pin and the published version ·</text>
    <text x="373" y="238" fill="#57606a">the version read and the latest ·</text>
    <text x="373" y="254" fill="#57606a">the hash of a page · the list of an index</text>

    <rect x="361" y="280" width="258" height="80" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="373" y="300" font-weight="600" fill="#1f2328">Says, source by source</text>
    <text x="373" y="318" fill="#57606a">up to date · behind · unreadable</text>
    <text x="373" y="334" fill="#57606a">ids, versions, addresses and counts:</text>
    <text x="373" y="350" fill="#57606a">never the text it read</text>
  </g>

  <!-- repository -->
  <rect x="670" y="72" width="290" height="300" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="686" y="94" font-size="13" font-weight="600" fill="#1f2328">Repository</text>
  <g font-size="12">
    <rect x="686" y="104" width="258" height="86" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="698" y="124" font-weight="600" fill="#1f2328">Register · committed</text>
    <text x="698" y="142" fill="#57606a">each source, the files that rely on it,</text>
    <text x="698" y="158" fill="#57606a">and what was read of it: a version,</text>
    <text x="698" y="174" fill="#57606a">a hash, a list of addresses, a date</text>

    <rect x="686" y="200" width="258" height="70" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="698" y="220" font-weight="600" fill="#1f2328">Record · docs/claude-code-watch.md</text>
    <text x="698" y="238" fill="#57606a">what was read, and the decision taken</text>
    <text x="698" y="254" fill="#57606a">for each change</text>

    <rect x="686" y="280" width="258" height="80" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="698" y="300" font-weight="600" fill="#1f2328">Mechanisms</text>
    <text x="698" y="318" fill="#57606a">worker, loop, profiles, auth proxy,</text>
    <text x="698" y="334" fill="#57606a">broker, topology: a page that moved</text>
    <text x="698" y="350" fill="#57606a">names the files to read again</text>
  </g>

  <!-- arrows between the zones -->
  <g font-size="11.5" fill="#57606a">
    <path d="M345 139H312" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="328" y="131" text-anchor="middle">reads</text>
    <path d="M670 227H637" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="653" y="219" text-anchor="middle">with</text>
    <path d="M490 372V398" fill="none" stroke="#cf222e" stroke-width="1.4" marker-end="url(#r)"/>
    <text x="498" y="389" fill="#cf222e">behind</text>
  </g>

  <!-- the loop when a source moved -->
  <rect x="20" y="400" width="940" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="36" y="422" font-size="13" font-weight="600" fill="#1f2328">When a source moved · the maintainer, never the command</text>
  <g font-size="11.5">
    <rect x="36" y="434" width="172" height="86" rx="6" fill="#ffffff" stroke="#cf222e"/>
    <text x="46" y="453" font-weight="600" fill="#1f2328">1 · Red</text>
    <text x="46" y="471" fill="#57606a">the weekly workflow, or</text>
    <text x="46" y="486" fill="#57606a">the command by hand</text>

    <rect x="220" y="434" width="172" height="86" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="230" y="453" font-weight="600" fill="#1f2328">2 · Read what changed</text>
    <text x="230" y="471" fill="#57606a">the new text beside the</text>
    <text x="230" y="486" fill="#57606a">one read last time: the</text>
    <text x="230" y="501" fill="#57606a">difference, not the page</text>

    <rect x="404" y="434" width="172" height="86" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="414" y="453" font-weight="600" fill="#1f2328">3 · Classify</text>
    <text x="414" y="471" fill="#57606a">mandatory · pertinent ·</text>
    <text x="414" y="486" fill="#57606a">does not apply, with its</text>
    <text x="414" y="501" fill="#57606a">reason</text>

    <rect x="588" y="434" width="172" height="86" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="598" y="453" font-weight="600" fill="#1f2328">4 · Decide, then prove</text>
    <text x="598" y="471" fill="#57606a">a pin moves alone, with</text>
    <text x="598" y="486" fill="#57606a">the gate as its proof</text>

    <rect x="772" y="434" width="172" height="86" rx="6" fill="#ffffff" stroke="#1a7f37"/>
    <text x="782" y="453" font-weight="600" fill="#1f2328">5 · Record</text>
    <text x="782" y="471" fill="#57606a">the decision in the record,</text>
    <text x="782" y="486" fill="#57606a">the reading in the register</text>

    <path d="M208 477H218" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
    <path d="M392 477H402" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
    <path d="M576 477H586" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
    <path d="M760 477H770" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
    <path d="M858 434V374" fill="none" stroke="#1a7f37" stroke-width="1.4" marker-end="url(#g)"/>
  </g>
</svg>
