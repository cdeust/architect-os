<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How a step is tested and verified</title>
  <desc id="d">Five checks come before the gate: scenarios written with the code, mutation of the changed lines, an independent review in a read-only sandbox, fresh inputs invented by another session, and a measure before the real system. A finding of any of them goes back to the code. When all are green, the gate runs on the host and in CI, and one command, npm run deliver, bound to the hash of the commit, delivers that same commit to the branch and then to main, both held by a ruleset that requires the gate, whose evaluation it reads after each push. Under each check, what it gave on one piece of work, the delivery command of 18 November 2026; the fresh inputs were not applied to it, and found three defects on the next piece of work. Decided and not built, marked next: scenarios written by another session and frozen, invented inputs as a phase, evals of prompts, findings given with a failing scenario, and a human gate at delivery. Also decided and not built: the duration of the suite, whose scenarios run one at a time, measured and shortened by running together what shares neither a port nor a file.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="979" height="699" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328">How a step is tested and verified</text>
  <text x="24" y="54" font-size="12.5" fill="#57606a">Five checks before the gate. Under each, what it gave on one piece of work: the delivery command, 18 November 2026 (journal, §89 to §95)</text>

  <g font-size="12" fill="#57606a">
    <!-- 1 scenarios -->
    <rect x="20" y="78" width="180" height="190" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="110" y="102" text-anchor="middle" font-weight="600" font-size="13" fill="#1f2328">1 · Scenarios</text>
    <text x="110" y="126" text-anchor="middle">Every test is a Gherkin</text>
    <text x="110" y="142" text-anchor="middle">scenario, written with</text>
    <text x="110" y="158" text-anchor="middle">the code; no other form.</text>
    <text x="110" y="174" text-anchor="middle">It must fail without the</text>
    <text x="110" y="190" text-anchor="middle">behaviour it names.</text>
    <path d="M36 206H184" stroke="#d0d7de"/>
    <text x="110" y="228" text-anchor="middle" font-weight="600" fill="#1f2328">436 scenarios,</text>
    <text x="110" y="244" text-anchor="middle" font-weight="600" fill="#1f2328">none of them on the network</text>

    <!-- 2 mutation -->
    <rect x="210" y="78" width="180" height="190" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="300" y="102" text-anchor="middle" font-weight="600" font-size="13" fill="#1f2328">2 · Mutation</text>
    <text x="300" y="126" text-anchor="middle">Each changed line is</text>
    <text x="300" y="142" text-anchor="middle">broken on purpose: a</text>
    <text x="300" y="158" text-anchor="middle">scenario must turn red.</text>
    <text x="300" y="174" text-anchor="middle">A line nothing proves is</text>
    <text x="300" y="190" text-anchor="middle">proven or removed.</text>
    <path d="M226 206H374" stroke="#d0d7de"/>
    <text x="300" y="228" text-anchor="middle" font-weight="600" fill="#1f2328">survivors on 3 full runs,</text>
    <text x="300" y="244" text-anchor="middle" font-weight="600" fill="#1f2328">none of 891 at the gate</text>

    <!-- 3 review -->
    <rect x="400" y="78" width="180" height="190" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="490" y="102" text-anchor="middle" font-weight="600" font-size="13" fill="#1f2328">3 · Independent review</text>
    <text x="490" y="126" text-anchor="middle">A fresh session reads the</text>
    <text x="490" y="142" text-anchor="middle">change against the design</text>
    <text x="490" y="158" text-anchor="middle">and cannot write: a</text>
    <text x="490" y="174" text-anchor="middle">verdict, and the list of</text>
    <text x="490" y="190" text-anchor="middle">what it could not check.</text>
    <path d="M416 206H564" stroke="#d0d7de"/>
    <text x="490" y="228" text-anchor="middle" font-weight="600" fill="#1f2328">5 reviews; 2 defects in the</text>
    <text x="490" y="244" text-anchor="middle" font-weight="600" fill="#1f2328">resume of a delivery</text>

    <!-- 4 fresh inputs -->
    <rect x="590" y="78" width="180" height="190" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="680" y="102" text-anchor="middle" font-weight="600" font-size="13" fill="#1f2328">4 · Fresh inputs</text>
    <text x="680" y="126" text-anchor="middle">A fresh session invents</text>
    <text x="680" y="142" text-anchor="middle">inputs the scenarios do</text>
    <text x="680" y="158" text-anchor="middle">not use; expected results</text>
    <text x="680" y="174" text-anchor="middle">come from the contract.</text>
    <text x="680" y="190" text-anchor="middle">Read, then run on the host.</text>
    <path d="M606 206H754" stroke="#d0d7de"/>
    <text x="680" y="228" text-anchor="middle" font-weight="600" fill="#cf222e">not applied to this work;</text>
    <text x="680" y="244" text-anchor="middle" font-weight="600" fill="#1f2328">on the next, 3 defects (§99)</text>

    <!-- 5 measure -->
    <rect x="780" y="78" width="180" height="190" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="870" y="102" text-anchor="middle" font-weight="600" font-size="13" fill="#1f2328">5 · Measure</text>
    <text x="870" y="126" text-anchor="middle">What is claimed of an</text>
    <text x="870" y="142" text-anchor="middle">outside tool is measured</text>
    <text x="870" y="158" text-anchor="middle">before the real thing,</text>
    <text x="870" y="174" text-anchor="middle">and what was read</text>
    <text x="870" y="190" text-anchor="middle">is recorded.</text>
    <path d="M796 206H944" stroke="#d0d7de"/>
    <text x="870" y="228" text-anchor="middle" font-weight="600" fill="#1f2328">2 answers of the real forge</text>
    <text x="870" y="244" text-anchor="middle" font-weight="600" fill="#1f2328">read before the first delivery</text>
  </g>

  <!-- a finding goes back to the code -->
  <g stroke="#cf222e" stroke-width="1.6" fill="none">
    <path d="M300 268V296"/><path d="M490 268V296"/><path d="M680 268V296"/>
    <path d="M870 268V296H110V270" marker-end="url(#r)"/>
  </g>
  <rect x="254" y="284" width="472" height="24" rx="12" fill="#ffffff" stroke="#cf222e"/>
  <text x="490" y="300" text-anchor="middle" font-size="12" fill="#cf222e">a finding goes back to the code, and the checks run again from the first</text>

  <!-- all green -->
  <path d="M50 268V330" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="58" y="322" font-size="11.5" fill="#57606a">all five green</text>

  <!-- 6 gate -->
  <g font-size="12" fill="#57606a">
    <rect x="20" y="332" width="700" height="76" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="36" y="355" font-weight="600" font-size="13" fill="#1f2328">6 · The gate: npm run gate on the host, then CI on Linux and macOS</text>
    <text x="36" y="376">every scenario run once, none skipped or filtered · executed = base + added − removed, from the runner's report</text>
    <text x="36" y="394">no surviving mutant on the changed lines · each verdict of the mutation tool replayed outside it</text>

    <!-- 7 commit -->
    <rect x="740" y="332" width="220" height="76" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="850" y="355" text-anchor="middle" font-weight="600" font-size="13" fill="#1f2328">7 · Commit and delivery</text>
    <text x="850" y="372" text-anchor="middle" font-size="11.5">npm run deliver: the gate and CI</text>
    <text x="850" y="385" text-anchor="middle" font-size="11.5">for the hash, then the branch and</text>
    <text x="850" y="398" text-anchor="middle" font-size="11.5">main, the ruleset read after each</text>
  </g>
  <path d="M720 370H738" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- legend -->
  <rect x="20" y="430" width="16" height="16" rx="3" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="44" y="443" font-size="12" fill="#57606a">on the host</text>
  <rect x="150" y="430" width="16" height="16" rx="3" fill="#fff8e1" stroke="#bf8700"/>
  <text x="174" y="443" font-size="12" fill="#57606a">a session of its own inside an srt sandbox; fresh inputs are played by hand, not yet a phase of the loop's tool</text>
  <!-- next: decided or designed, not built -->
  <path d="M20 466H960" stroke="#d0d7de"/>
  <rect x="20" y="476" width="36" height="16" rx="8" fill="#ddf4ff" stroke="#218bff"/><text x="38" y="487.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#0969da">next</text>
  <text x="64" y="488" font-size="12.5" font-weight="600" fill="#1f2328">Decided or designed, not built yet</text>
  <rect x="20" y="500" width="178" height="87" rx="8" fill="#ffffff" stroke="#218bff" stroke-dasharray="5 4"/>
  <text x="32" y="520" font-size="12" font-weight="600" fill="#1f2328">Frozen scenarios</text>
  <text x="32" y="538" font-size="11.5" fill="#57606a">written by another</text>
  <text x="32" y="553" font-size="11.5" fill="#57606a">session, read-only for</text>
  <text x="32" y="568" font-size="11.5" fill="#57606a">the build</text>
  <rect x="210" y="500" width="178" height="87" rx="8" fill="#ffffff" stroke="#218bff" stroke-dasharray="5 4"/>
  <text x="222" y="520" font-size="12" font-weight="600" fill="#1f2328">Invented inputs</text>
  <text x="222" y="538" font-size="11.5" fill="#57606a">a fresh session invents</text>
  <text x="222" y="553" font-size="11.5" fill="#57606a">inputs the build did not</text>
  <text x="222" y="568" font-size="11.5" fill="#57606a">use, as a phase</text>
  <rect x="401" y="500" width="178" height="87" rx="8" fill="#ffffff" stroke="#218bff" stroke-dasharray="5 4"/>
  <text x="413" y="520" font-size="12" font-weight="600" fill="#1f2328">Evals of prompts</text>
  <text x="413" y="538" font-size="11.5" fill="#57606a">a specimen, an expected</text>
  <text x="413" y="553" font-size="11.5" fill="#57606a">result, replayed when a</text>
  <text x="413" y="568" font-size="11.5" fill="#57606a">prompt or model changes</text>
  <rect x="591" y="500" width="178" height="87" rx="8" fill="#ffffff" stroke="#218bff" stroke-dasharray="5 4"/>
  <text x="603" y="520" font-size="12" font-weight="600" fill="#1f2328">Proven findings</text>
  <text x="603" y="538" font-size="11.5" fill="#57606a">a finding of correctness</text>
  <text x="603" y="553" font-size="11.5" fill="#57606a">comes with the scenario</text>
  <text x="603" y="568" font-size="11.5" fill="#57606a">that fails</text>
  <rect x="782" y="500" width="178" height="87" rx="8" fill="#ffffff" stroke="#218bff" stroke-dasharray="5 4"/>
  <text x="794" y="520" font-size="12" font-weight="600" fill="#1f2328">Human gate</text>
  <text x="794" y="538" font-size="11.5" fill="#57606a">a person approves before</text>
  <text x="794" y="553" font-size="11.5" fill="#57606a">main; the orchestrator has</text>
  <text x="794" y="568" font-size="11.5" fill="#57606a">no bypass</text>
  <rect x="20" y="597" width="369" height="87" rx="8" fill="#ffffff" stroke="#218bff" stroke-dasharray="5 4"/>
  <text x="32" y="617" font-size="12" font-weight="600" fill="#1f2328">The duration of the suite</text>
  <text x="32" y="635" font-size="11.5" fill="#57606a">scenarios run one at a time, and the mutation tool plays</text>
  <text x="32" y="650" font-size="11.5" fill="#57606a">them once more: measure where the time goes, run at the</text>
  <text x="32" y="665" font-size="11.5" fill="#57606a">same time what shares neither a port nor a file</text>
</svg>
