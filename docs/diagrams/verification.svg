<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How a step is tested and verified</title>
  <desc id="d">Five checks come before the gate: scenarios written with the code, mutation of the changed lines, an independent review in a read-only sandbox, fresh inputs invented by another session, and a measure before the real system. A finding of any of them goes back to the code. When all are green, the gate runs on the host and in CI, and the host commits and pushes. Under each check, what it gave on one step, the Docker adapter of 16 November 2026.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="979" height="469" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328">How a step is tested and verified</text>
  <text x="24" y="54" font-size="12.5" fill="#57606a">Five checks before the gate. Under each, what it gave on one step: the Docker adapter, 16 November 2026 (journal, §51)</text>

  <g font-size="12" fill="#57606a">
    <!-- 1 scenarios -->
    <rect x="20" y="78" width="180" height="190" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="110" y="102" text-anchor="middle" font-weight="600" font-size="13" fill="#1f2328">1 · Scenarios</text>
    <text x="110" y="126" text-anchor="middle">Every test is a Gherkin</text>
    <text x="110" y="142" text-anchor="middle">scenario, written with</text>
    <text x="110" y="158" text-anchor="middle">the code; no other form.</text>
    <text x="110" y="174" text-anchor="middle">It must fail without the</text>
    <text x="110" y="190" text-anchor="middle">behaviour it names.</text>
    <path d="M36 206H184" stroke="#d0d7de"/>
    <text x="110" y="228" text-anchor="middle" font-weight="600" fill="#1f2328">94 scenarios,</text>
    <text x="110" y="244" text-anchor="middle" font-weight="600" fill="#1f2328">green three times in a row</text>

    <!-- 2 mutation -->
    <rect x="210" y="78" width="180" height="190" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="300" y="102" text-anchor="middle" font-weight="600" font-size="13" fill="#1f2328">2 · Mutation</text>
    <text x="300" y="126" text-anchor="middle">Each changed line is</text>
    <text x="300" y="142" text-anchor="middle">broken on purpose: a</text>
    <text x="300" y="158" text-anchor="middle">scenario must turn red.</text>
    <text x="300" y="174" text-anchor="middle">A line nothing proves is</text>
    <text x="300" y="190" text-anchor="middle">proven or removed.</text>
    <path d="M226 206H374" stroke="#d0d7de"/>
    <text x="300" y="228" text-anchor="middle" font-weight="600" fill="#1f2328">7 mutants nothing killed,</text>
    <text x="300" y="244" text-anchor="middle" font-weight="600" fill="#1f2328">then none of 244</text>

    <!-- 3 review -->
    <rect x="400" y="78" width="180" height="190" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="490" y="102" text-anchor="middle" font-weight="600" font-size="13" fill="#1f2328">3 · Independent review</text>
    <text x="490" y="126" text-anchor="middle">A fresh session reads the</text>
    <text x="490" y="142" text-anchor="middle">change against the design</text>
    <text x="490" y="158" text-anchor="middle">and cannot write: a</text>
    <text x="490" y="174" text-anchor="middle">verdict, and the list of</text>
    <text x="490" y="190" text-anchor="middle">what it could not check.</text>
    <path d="M416 206H564" stroke="#d0d7de"/>
    <text x="490" y="228" text-anchor="middle" font-weight="600" fill="#1f2328">2 reviews, 21 findings,</text>
    <text x="490" y="244" text-anchor="middle" font-weight="600" fill="#1f2328">11 on correctness</text>

    <!-- 4 fresh inputs -->
    <rect x="590" y="78" width="180" height="190" rx="8" fill="#fff8e1" stroke="#bf8700"/>
    <text x="680" y="102" text-anchor="middle" font-weight="600" font-size="13" fill="#1f2328">4 · Fresh inputs</text>
    <text x="680" y="126" text-anchor="middle">A fresh session invents</text>
    <text x="680" y="142" text-anchor="middle">inputs the scenarios do</text>
    <text x="680" y="158" text-anchor="middle">not use; expected results</text>
    <text x="680" y="174" text-anchor="middle">come from the contract.</text>
    <text x="680" y="190" text-anchor="middle">Read, then run on the host.</text>
    <path d="M606 206H754" stroke="#d0d7de"/>
    <text x="680" y="228" text-anchor="middle" font-weight="600" fill="#1f2328">57 inputs, 3 defects no</text>
    <text x="680" y="244" text-anchor="middle" font-weight="600" fill="#1f2328">other check had seen</text>

    <!-- 5 measure -->
    <rect x="780" y="78" width="180" height="190" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="870" y="102" text-anchor="middle" font-weight="600" font-size="13" fill="#1f2328">5 · Measure</text>
    <text x="870" y="126" text-anchor="middle">What is claimed of an</text>
    <text x="870" y="142" text-anchor="middle">outside tool is measured</text>
    <text x="870" y="158" text-anchor="middle">before the real thing, by</text>
    <text x="870" y="174" text-anchor="middle">a script kept in bench/,</text>
    <text x="870" y="190" text-anchor="middle">played twice.</text>
    <path d="M796 206H944" stroke="#d0d7de"/>
    <text x="870" y="228" text-anchor="middle" font-weight="600" fill="#1f2328">11 questions before a</text>
    <text x="870" y="244" text-anchor="middle" font-weight="600" fill="#1f2328">rootless Docker daemon</text>
  </g>

  <!-- a finding goes back to the code -->
  <g stroke="#cf222e" stroke-width="1.6" fill="none">
    <path d="M300 268V296"/><path d="M490 268V296"/><path d="M680 268V296"/>
    <path d="M870 268V296H110V270" marker-end="url(#r)"/>
  </g>
  <rect x="254" y="284" width="472" height="24" rx="12" fill="#ffffff" stroke="#cf222e"/>
  <text x="490" y="300" text-anchor="middle" font-size="12" fill="#cf222e">a finding goes back to the code, and the checks run again from the first</text>

  <!-- all green -->
  <path d="M50 268V330" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="58" y="322" font-size="11.5" fill="#57606a">all five green</text>

  <!-- 6 gate -->
  <g font-size="12" fill="#57606a">
    <rect x="20" y="332" width="760" height="76" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="36" y="355" font-weight="600" font-size="13" fill="#1f2328">6 · The gate: npm run gate on the host, then CI on Linux and macOS</text>
    <text x="36" y="376">every scenario run once, none skipped or filtered · executed = base + added − removed, read from the runner's report</text>
    <text x="36" y="394">no surviving mutant on the changed lines · each verdict of the mutation tool replayed outside it</text>

    <!-- 7 commit -->
    <rect x="800" y="332" width="160" height="76" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="880" y="355" text-anchor="middle" font-weight="600" font-size="13" fill="#1f2328">7 · Commit, push</text>
    <text x="880" y="376" text-anchor="middle">by the host; the journal</text>
    <text x="880" y="394" text-anchor="middle">says what is not proven</text>
  </g>
  <path d="M780 370H798" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- legend -->
  <rect x="20" y="430" width="16" height="16" rx="3" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="44" y="443" font-size="12" fill="#57606a">on the host</text>
  <rect x="150" y="430" width="16" height="16" rx="3" fill="#fff8e1" stroke="#bf8700"/>
  <text x="174" y="443" font-size="12" fill="#57606a">a session of its own inside an srt sandbox; fresh inputs are applied by hand today, not yet built into the loop's tool</text>
</svg>
