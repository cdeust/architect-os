<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 534" width="980" height="534" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">The evidence desk: a fact enters the loop only once verified</title>
  <desc id="d">The orchestrator asks a question. A librarian, Claude Science in its own sandbox, answers from the published literature with DOIs, passages and the full texts. A verifier on the host checks each DOI at doi.org and looks for each passage in the full text. A verified record goes to a ledger the librarian cannot write; a refusal goes back with named reasons.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="979" height="533" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328">The evidence desk: a fact enters the loop only once verified</text>
  <text x="24" y="54" font-size="12.5" fill="#57606a">tools/evidence · npm run evidence -- ask | verify · contract in packages/contracts</text>

  <!-- host -->
  <rect x="20" y="72" width="300" height="330" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="36" y="94" font-size="13" font-weight="600" fill="#1f2328">Host</text>
  <g font-size="12">
    <rect x="36" y="104" width="268" height="54" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="48" y="124" font-weight="600" fill="#1f2328">Orchestrator</text>
    <text x="48" y="142" fill="#57606a">asks a question, no code and no secret</text>

    <rect x="36" y="172" width="268" height="88" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="48" y="192" font-weight="600" fill="#1f2328">Ledger · host only, authoritative</text>
    <text x="48" y="210" fill="#57606a">asked/ the question as it was asked</text>
    <text x="48" y="226" fill="#57606a">verified/ the verified records</text>
    <text x="48" y="242" fill="#57606a">sources/ each text, kept by its SHA-256</text>

    <rect x="36" y="290" width="268" height="98" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="48" y="310" font-weight="600" fill="#1f2328">Verifier · code, not a model</text>
    <text x="48" y="328" fill="#57606a">the DOI exists · it names this article ·</text>
    <text x="48" y="344" fill="#57606a">the article is not retracted · the passage</text>
    <text x="48" y="360" fill="#57606a">is in the full text, word for word ·</text>
    <text x="48" y="376" fill="#57606a">the text carries the article's title</text>
  </g>

  <!-- desk -->
  <rect x="350" y="72" width="270" height="330" rx="8" fill="#ffffff" stroke="#8c959f" stroke-dasharray="5 4"/>
  <text x="366" y="94" font-size="13" font-weight="600" fill="#1f2328">Desk · nothing here is trusted</text>
  <g font-size="12">
    <rect x="366" y="104" width="238" height="112" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="378" y="124" font-weight="600" fill="#1f2328">out/ · the host writes</text>
    <text x="378" y="142" fill="#57606a">&lt;id&gt;.question.json</text>
    <text x="378" y="158" fill="#57606a">&lt;id&gt;.rejected.json, named reasons</text>
    <text x="378" y="174" fill="#57606a">SKILL.md, answer.schema.json</text>
    <text x="378" y="198" fill="#57606a" font-style="italic">read-only for the librarian</text>

    <rect x="366" y="258" width="238" height="112" rx="6" fill="#fff8e1" stroke="#bf8700"/>
    <text x="378" y="278" font-weight="600" fill="#1f2328">in/ · the librarian writes</text>
    <text x="378" y="296" fill="#57606a">&lt;id&gt;.answer.json: claims, DOIs,</text>
    <text x="378" y="312" fill="#57606a">passages</text>
    <text x="378" y="328" fill="#57606a">&lt;name&gt;.txt: an article's full text</text>
    <text x="378" y="352" fill="#57606a" font-style="italic">flat, read without following a link</text>
  </g>

  <!-- librarian -->
  <rect x="650" y="72" width="310" height="330" rx="8" fill="#fff8e1" stroke="#bf8700"/>
  <text x="666" y="94" font-size="13" font-weight="600" fill="#1f2328">Librarian · Claude Science, its own sandbox</text>
  <g font-size="12">
    <rect x="666" y="104" width="278" height="54" rx="6" fill="#ffffff" stroke="#bf8700"/>
    <text x="678" y="124" font-weight="600" fill="#1f2328">Sees the desk only</text>
    <text x="678" y="142" fill="#57606a">never the repository, never the ledger</text>

    <rect x="666" y="172" width="278" height="70" rx="6" fill="#ffffff" stroke="#bf8700"/>
    <text x="678" y="192" font-weight="600" fill="#1f2328">Searches the published literature</text>
    <text x="678" y="210" fill="#57606a">OpenAlex · Crossref · arXiv · PubMed ·</text>
    <text x="678" y="226" fill="#57606a">its research connectors</text>

    <rect x="666" y="258" width="278" height="112" rx="6" fill="#ffffff" stroke="#bf8700"/>
    <text x="678" y="278" font-weight="600" fill="#1f2328">Answers</text>
    <text x="678" y="296" fill="#57606a">for each claim: a DOI, the article's title,</text>
    <text x="678" y="312" fill="#57606a">a passage copied word for word, and the</text>
    <text x="678" y="328" fill="#57606a">full text saved beside the answer;</text>
    <text x="678" y="352" fill="#57606a">says what it did not find</text>
  </g>

  <!-- arrows -->
  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M304 131H364"/>
    <path d="M604 131H664"/>
    <path d="M666 314H606"/>
    <path d="M366 330H306"/>
    <path d="M170 388V424"/>
  </g>
  <path d="M110 290V262" stroke="#1a7f37" stroke-width="1.6" fill="none" marker-end="url(#g)"/>
  <text x="118" y="281" font-size="11.5" fill="#1a7f37">verified</text>
  <path d="M304 304H334V186H364" stroke="#cf222e" stroke-width="1.6" fill="none" marker-end="url(#r)"/>
  <text x="339" y="226" font-size="11.5" fill="#cf222e" transform="rotate(90 339 226)">refused</text>
  <g font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">
    <circle cx="334" cy="131" r="9" fill="#57606a"/><text x="334" y="135">1</text>
    <circle cx="634" cy="131" r="9" fill="#57606a"/><text x="634" y="135">2</text>
    <circle cx="636" cy="314" r="9" fill="#57606a"/><text x="636" y="318">3</text>
    <circle cx="336" cy="330" r="9" fill="#57606a"/><text x="336" y="334">4</text>
  </g>

  <!-- registry -->
  <rect x="36" y="426" width="268" height="40" rx="6" fill="#ddf4ff" stroke="#218bff"/>
  <text x="170" y="451" text-anchor="middle" font-size="12" fill="#1f2328">doi.org · the DOI registry, every agency</text>

  <!-- strip -->
  <rect x="350" y="418" width="610" height="98" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="366" y="438" font-size="12.5" font-weight="600" fill="#1f2328">Every refusal is named and goes back to the librarian</text>
  <text x="366" y="456" font-size="11.5" fill="#57606a">DOI_UNKNOWN · TITLE_MISMATCH · RETRACTED · SOURCE_TEXT_MISSING · TEXT_NOT_OF_DOI</text>
  <text x="366" y="473" font-size="11.5" fill="#57606a">QUOTE_ABSENT · ANSWER_INVALID · ANSWER_ID_MISMATCH · QUESTION_UNKNOWN</text>
  <text x="366" y="496" font-size="11.5" fill="#57606a">Each record states its proof level: quote_in_supplied_text, the text being the one the librarian saved.</text>
</svg>
