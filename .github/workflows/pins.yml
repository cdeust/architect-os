# The watch of the two pins the platform runs on (docs/claude-code-watch.md): the Claude Agent SDK, whose package holds
# the Claude Code binary the workers and the orchestration loop launch, and the sandbox runtime. Red when a published
# version is ahead of a pin: someone then reads the changelog between the two and moves the pin, with the gate as proof.
# No secret, no install: it reads two package.json files and asks the registry for two versions.
name: pins

on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:17 UTC. GitHub runs a schedule on the default branch only.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  pins:
    name: pins
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: The pins against what is published
        run: |
          behind=0
          check() {
            pinned="$(node -p "require('./$2').dependencies['$1']")"
            published="$(npm view "$1" version)"
            echo "$1: pinned $pinned, published $published"
            [ "$pinned" = "$published" ] || behind=1
          }
          check @anthropic-ai/claude-agent-sdk services/memory/package.json
          check @anthropic-ai/sandbox-runtime packages/sandbox/package.json
          if [ "$behind" = 1 ]; then
            echo "A pin is behind: read https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md between the two versions, record what applies in docs/claude-code-watch.md, and move the pin."
            exit 1
          fi
