# Each native slice and its independent replay use distinct standard GitHub-hosted VMs.
name: gate mutation lane
on:
  workflow_call:
    inputs:
      lane:
        type: number
        required: true
permissions:
  contents: read
  actions: read
jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-24.04
    env:
      AOS_GATE_JOB: mutation-${{ inputs.lane }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Provision the job runtime root
        run: sh "$GITHUB_WORKSPACE/tools/runtime/provision-hosted.sh"

      - name: Point the destination of the gate at the first parent of the commit this event judges
        # tools/test-gate/src/domain/destination.ts: the gate takes as first parent the reference `destination` of
        # tools/test-gate/gate.json. In CI the head is the commit GitHub judges (its merge commit for a pull request,
        # the pushed commit otherwise), so the destination is that commit's first parent, never a fetch of the live
        # branch, which may have moved since. The reference comes from env, never written into the command.
        env:
          AOS_GATE_DESTINATION: refs/remotes/origin/main
        run: git update-ref "$AOS_GATE_DESTINATION" HEAD^1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Host dependencies
        run: |
          "$GITHUB_WORKSPACE/aos" -- sh "$GITHUB_WORKSPACE/tools/runtime/install-host-packages.sh" gate
          bwrap --version

      - name: Host requirement - allow unprivileged user namespaces with capabilities (E-07, R-13)
        run: |
          echo "before: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "after: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"

      - name: PostgreSQL 17 (PGDG) with pgvector
        run: |
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/postgres --version

      - name: Admit the Gate job
        id: runtime
        run: ./aos -- node tools/runtime/gate-job.mjs capture

      - name: Install (lockfile, scripts disabled)
        env:
          AOS_GATE_CONTEXT_SHA: ${{ steps.runtime.outputs.context_sha }}
        run: sh tools/runtime/gate-job.sh -- npm ci --ignore-scripts

      - name: Run mutation producer
        env:
          AOS_GATE_CONTEXT_SHA: ${{ steps.runtime.outputs.context_sha }}
          AOS_LANE: ${{ inputs.lane }}
        run: |
          sh tools/runtime/gate-job.sh -- /usr/bin/python3 -I tools/test-gate/with-tree-lock.py exec bash -e -o pipefail <<'ADMITTED'
          /usr/bin/python3 -I tools/test-gate/with-tree-lock.py candidate npm exec --no -- tsc -b
          node --import tsx tools/test-gate/src/hosted.ts inventory "$AOS_LANE"
          AOS_NATIVE_MUTATION_LOTS=1 /usr/bin/python3 -I tools/test-gate/with-tree-lock.py candidate npm exec --no -- stryker run
          node --import tsx tools/test-gate/src/hosted.ts verify "$AOS_LANE"
          git rev-parse --verify HEAD > "$ARCHITECT_OS_RUN_DIR/reports/mutation/head"
          ADMITTED

      - name: Verify the report tree for upload
        id: exports
        if: always() && steps.runtime.outcome == 'success'
        env:
          AOS_GATE_CONTEXT_SHA: ${{ steps.runtime.outputs.context_sha }}
        run: sh tools/runtime/gate-job.sh -- node tools/test-gate/report-files.mjs publish

      - name: Upload the mutation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-mutation-linux-${{ github.run_attempt }}-${{ inputs.lane }}
          path: |
            ${{ steps.exports.outputs.reports }}/mutation/native.json
            ${{ steps.exports.outputs.reports }}/mutation/head
            ${{ steps.exports.outputs.reports }}/mutation-inventory.json
          if-no-files-found: error

  replay:
    name: replay
    runs-on: ubuntu-24.04
    env:
      AOS_GATE_JOB: replay-${{ inputs.lane }}
    needs: mutation
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Provision the job runtime root
        run: sh "$GITHUB_WORKSPACE/tools/runtime/provision-hosted.sh"

      - name: Point the destination of the gate at the first parent of the commit this event judges
        # tools/test-gate/src/domain/destination.ts: the gate takes as first parent the reference `destination` of
        # tools/test-gate/gate.json. In CI the head is the commit GitHub judges (its merge commit for a pull request,
        # the pushed commit otherwise), so the destination is that commit's first parent, never a fetch of the live
        # branch, which may have moved since. The reference comes from env, never written into the command.
        env:
          AOS_GATE_DESTINATION: refs/remotes/origin/main
        run: git update-ref "$AOS_GATE_DESTINATION" HEAD^1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Host dependencies
        run: |
          "$GITHUB_WORKSPACE/aos" -- sh "$GITHUB_WORKSPACE/tools/runtime/install-host-packages.sh" gate
          bwrap --version

      - name: Host requirement - allow unprivileged user namespaces with capabilities (E-07, R-13)
        run: |
          echo "before: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "after: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"

      - name: PostgreSQL 17 (PGDG) with pgvector
        run: |
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/postgres --version

      - name: Admit the Gate job
        id: runtime
        run: ./aos -- node tools/runtime/gate-job.mjs capture

      - name: Install (lockfile, scripts disabled)
        env:
          AOS_GATE_CONTEXT_SHA: ${{ steps.runtime.outputs.context_sha }}
        run: sh tools/runtime/gate-job.sh -- npm ci --ignore-scripts

      - name: Fetch the mutation report
        env:
          AOS_GATE_CONTEXT_SHA: ${{ steps.runtime.outputs.context_sha }}
          GH_TOKEN: ${{ github.token }}
          AOS_LANE: ${{ inputs.lane }}
        run: sh tools/runtime/gate-job.sh -- sh tools/test-gate/fetch-ci-artifacts.sh mutation "$AOS_LANE"

      - name: Build and independently replay this lot
        env:
          AOS_GATE_CONTEXT_SHA: ${{ steps.runtime.outputs.context_sha }}
          AOS_LANE: ${{ inputs.lane }}
        run: |
          sh tools/runtime/gate-job.sh -- /usr/bin/python3 -I tools/test-gate/with-tree-lock.py exec bash -e -o pipefail <<'ADMITTED'
          /usr/bin/python3 -I tools/test-gate/with-tree-lock.py candidate npm exec --no -- tsc -b
          node --import tsx tools/test-gate/src/hosted.ts replay "$AOS_LANE"
          git rev-parse --verify HEAD > "$ARCHITECT_OS_RUN_DIR/reports/replay-shards/$AOS_LANE/head"
          ADMITTED

      - name: Verify the report tree for upload
        id: exports
        if: always() && steps.runtime.outcome == 'success'
        env:
          AOS_GATE_CONTEXT_SHA: ${{ steps.runtime.outputs.context_sha }}
        run: sh tools/runtime/gate-job.sh -- node tools/test-gate/report-files.mjs publish

      - name: Upload the replay lot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-replay-linux-${{ github.run_attempt }}-${{ inputs.lane }}
          path: ${{ steps.exports.outputs.reports }}/replay-shards/${{ inputs.lane }}/
          if-no-files-found: error
