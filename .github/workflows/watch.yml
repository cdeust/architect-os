# The watch of what the platform holds of Anthropic (docs/design/anthropic-watch.md): the pins, the changelogs, the two
# documentation indexes and the pages its mechanisms rely on, as tools/watch/watch.json names them. Red when a source
# moved since it was read (exit 1) or could not be read (exit 3): someone then reads what changed, decides, records
# the reading with `npm run watch -- read <id>` and the decision in docs/claude-code-watch.md.
# No secret, no cache, nothing written: the command prints ids, versions, addresses and counts, never the text it read.
# A second job asks the npm registry for the advisories published on the locked dependencies, direct or not: red from
# a moderate one. It is fixed in the lockfile (`npm audit fix --package-lock-only --ignore-scripts`), then the gate.
name: watch

on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:17 UTC. GitHub runs a schedule on the default branch only.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  watch:
    name: watch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Provision the job runtime root
        run: sh "$GITHUB_WORKSPACE/tools/runtime/provision-hosted.sh"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install (lockfile, scripts disabled)
        run: ./aos -- npm ci --ignore-scripts

      - name: The register against the sources
        run: ./aos -- npm run --silent watch -- check

  advisories:
    name: advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Provision the job runtime root
        run: sh "$GITHUB_WORKSPACE/tools/runtime/provision-hosted.sh"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: The advisories on the locked dependencies
        run: ./aos -- npm audit --audit-level=moderate
