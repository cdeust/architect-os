name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only the owner, members and collaborators can trigger Claude (docs/design/platform-v3-srt.md §9.1 C.4).
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    # The job's own token is in the environment of Claude Code, as DEFAULT_WORKFLOW_TOKEN for the action's CI tools
    # (src/mcp/install-mcp-server.ts at 4411a9e9): it reads and nothing more. The bot writes with the token of the
    # Claude app, which the action gets by OIDC (id-token).
    permissions:
      contents: read # the checkout
      actions: read # the action's CI tools read the results of the runs
      id-token: write # the exchange for the token of the Claude app
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The managed settings of this bot (.github/claude/managed-settings.json), from the commit of the run, where
      # Claude Code reads them above every other source (docs/infrastructure.md, "The Claude review"): no auto mode
      # and no bypass mode whatever a new pin of the action makes the default, no hook but managed ones, and no read
      # of .git. Only that directory, no cone; removed once installed.
      - name: Checkout the settings of this run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: claude-config
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/claude
          sparse-checkout-cone-mode: false
      - name: Install the managed settings of the bot
        run: |
          set -euo pipefail
          sudo install -D -m 0644 -o root -g root claude-config/.github/claude/managed-settings.json /etc/claude-code/managed-settings.json
          rm -rf claude-config

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The mode is set, not left to the action: from v1.0.290 a session starts in auto mode unless
          # allowed_bots is set (src/modes/permission-mode.ts). acceptEdits lets Claude edit the files of the
          # checkout, which is what the bot is asked for; the action adds its git wrappers and comment tool.
          claude_args: |
            --permission-mode acceptEdits
            --allowedTools "Read,Glob,Grep,Edit,Write"
            --model "claude-opus-5-5"
