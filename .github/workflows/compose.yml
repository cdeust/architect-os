# The first realisation (compose.yaml): its images are built and its stack is started, once, on a throwaway runner.
# features/infra/compose.feature reads the file; nothing else starts it. No secret, no cache: the two values of its
# environment file are written here and are worth nothing.
name: compose

on:
  pull_request:
  push:
    branches:
      - main
      # TEMPORARY, as in gate.yml: the owner removes the next entries at merge.
      - feat/gate-1a
      - sentinel/gate-1a-*
      - sentinel/compose-*

permissions:
  contents: read

jobs:
  compose-linux:
    name: compose-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install (lockfile, scripts disabled)
        run: npm ci --ignore-scripts

      - name: Environment file of the stack (values of no worth)
        run: printf 'GATEWAY_TOKENS=compose-smoke-token=smoke\nPOSTGRES_PASSWORD=compose-smoke-only\n' > .env

      - name: Build the images
        run: |
          docker compose build
          docker compose --profile build-only build memory-worker

      - name: Start the stack
        run: |
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          docker compose ps

      - name: The images the stack runs
        run: docker compose images

      - name: What the stack answers
        run: node compose/smoke.mjs http://127.0.0.1:8080 compose-smoke-token

      - name: What the services said
        if: always()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail 60 || true

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes || true
