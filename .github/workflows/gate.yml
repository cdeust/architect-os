# The CI gate (docs/design/platform-v3-srt.md §7): plan, Gherkin suite, Stryker on the changed lines, verdict.
# No secret, no cache. The token is the automatic one, restricted to contents: read and actions: read.
name: gate

on:
  pull_request:
  push:
    branches:
      - main
      # The delivery (CONTRIBUTING.md, the maintainer's line): a commit is pushed to a trial branch first, where
      # this gate gives it the two checks the rulesets of feat/gate-1a and of main require; it then reaches both
      # branches as it is. feat/gate-1a is not listed: it would run the same commit a second time.
      - sentinel/gate-1a-*

permissions:
  contents: read
  actions: read

jobs:
  gate-linux-cucumber:
    name: gate-linux-cucumber-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep
          bwrap --version

      - name: Host requirement - allow unprivileged user namespaces with capabilities (E-07, R-13)
        run: |
          echo "before: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "after: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"

      - name: PostgreSQL 17 (PGDG) with pgvector
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-17-pgvector
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/postgres --version

      - name: Install (lockfile, scripts disabled)
        run: npm ci --ignore-scripts

      - name: Run the functional suite lot
        env:
          AOS_SHARD: ${{ matrix.shard }}
        run: |
          npm exec --no -- tsc -b
          npm exec --no -- cucumber-js --shard "$AOS_SHARD/2" || test -s reports/cucumber.ndjson
          git rev-parse --verify HEAD > reports/cucumber-head

      - name: Upload the functional report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-cucumber-linux-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            reports/cucumber.ndjson
            reports/cucumber-head
          if-no-files-found: error

  gate-linux-mutation:
    name: gate-linux-mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep
          bwrap --version

      - name: Host requirement - allow unprivileged user namespaces with capabilities (E-07, R-13)
        run: |
          echo "before: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "after: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"

      - name: PostgreSQL 17 (PGDG) with pgvector
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-17-pgvector
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/postgres --version

      - name: Install (lockfile, scripts disabled)
        run: npm ci --ignore-scripts

      - name: Run mutation and independent replay
        run: |
          npm run gate -- --mutation-only
          git rev-parse --verify HEAD > reports/mutation/head

      - name: Upload mutation and replay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-mutation-linux-${{ github.run_attempt }}
          path: reports/mutation/
          if-no-files-found: error

  gate-linux:
    name: gate-linux
    runs-on: ubuntu-24.04
    needs: [gate-linux-cucumber, gate-linux-mutation]
    if: ${{ always() }}
    steps:
      - name: Require all producers
        id: admission
        env:
          CUCUMBER_RESULT: ${{ needs.gate-linux-cucumber.result }}
          MUTATION_RESULT: ${{ needs.gate-linux-mutation.result }}
        run: test "$CUCUMBER_RESULT" = success && test "$MUTATION_RESULT" = success

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install (lockfile, scripts disabled)
        run: npm ci --ignore-scripts

      - name: Fetch reports from the effective producer jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/test-gate/fetch-ci-artifacts.sh

      - name: Base of the count (artifact of the last green main run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # docs/design/platform-v3-srt.md §7.2: the run of gate.yml on main whose head_sha is the first parent.
          # Nothing found, expired or no first parent: download nothing, the gate applies its written fallback and says so.
          mkdir -p reports/base
          parent=$(git rev-parse --verify --quiet HEAD^1 || true)
          if [ -z "$parent" ]; then echo "base: no first parent"; exit 0; fi
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gate.yml/runs?branch=main&status=success&head_sha=$parent&per_page=1" --jq '.workflow_runs[0].id // empty' || true)
          if [ -z "$run_id" ]; then echo "base: no green main run for $parent"; exit 0; fi
          gh run download "$run_id" -n gate-base-linux -D reports/base -R "$GITHUB_REPOSITORY" || echo "base: artifact gate-base-linux of run $run_id not downloadable"

      - name: Gate
        env:
          AOS_CUCUMBER_SHARDS: '2'
        run: node --import tsx tools/test-gate/src/main.ts check --job linux

      - name: Upload reports
        if: ${{ always() && steps.admission.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-reports-linux
          path: reports/
          if-no-files-found: warn

      - name: Upload base for the next run
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-base-linux
          path: reports/gate-base.json
          if-no-files-found: error

  gate-macos:
    name: gate-macos
    # Pinned image: macos-latest moves without notice. The green runs of 2026-11-04 ran macos-26-arm64 (macOS 26.6.2).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # features/sandbox/ needs no Postgres: none is installed, a @postgres scenario landing there fails visibly.
      - name: Install (lockfile, scripts disabled)
        run: npm ci --ignore-scripts

      - name: Base of the count (artifact of the last green main run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # docs/design/platform-v3-srt.md §7.2: the run of gate.yml on main whose head_sha is the first parent.
          # Nothing found, expired or no first parent: download nothing, the gate applies its written fallback and says so.
          mkdir -p reports/base
          parent=$(git rev-parse --verify --quiet HEAD^1 || true)
          if [ -z "$parent" ]; then echo "base: no first parent"; exit 0; fi
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gate.yml/runs?branch=main&status=success&head_sha=$parent&per_page=1" --jq '.workflow_runs[0].id // empty' || true)
          if [ -z "$run_id" ]; then echo "base: no green main run for $parent"; exit 0; fi
          gh run download "$run_id" -n gate-base-macos -D reports/base -R "$GITHUB_REPOSITORY" || echo "base: artifact gate-base-macos of run $run_id not downloadable"

      - name: Gate
        run: npm run gate -- --job macos

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-reports-macos
          path: reports/
          if-no-files-found: warn

      - name: Upload base for the next run
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-base-macos
          path: reports/gate-base.json
          if-no-files-found: error
