# The Docker mode before a real rootless daemon (docs/design/platform-v3-srt.md §6, and §8, exit of 1b.6b): the check
# at start, the end-to-end scenario with the module and the workers in containers, and the escape test replayed.
# These scenarios cannot run in the gate: the host of the owner is macOS, where no such daemon runs.
# No secret, no cache. The token is the automatic one, restricted to contents: read.
name: rootless

on:
  pull_request:
  push:
    branches:
      - main
      # TEMPORARY, as in gate.yml: the owner removes the next entries at merge.
      - feat/gate-1a
      - sentinel/gate-1a-*
      - sentinel/rootless-*

permissions:
  contents: read

jobs:
  rootless-linux:
    name: rootless-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # What the operator of a host does, and the gateway never does (design, §6): a rootless daemon, started without a
      # bridge since no container of the platform has a network, as a unit of the user so that systemd bounds its
      # containers (cgroup v2).
      - name: Rootless Docker daemon, started by the user without a bridge
        run: |
          # The daemon itself is the one of the runner image, and these three packages are those of the distribution:
          # neither is pinned here, and the versions that ran are printed below.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends uidmap slirp4netns dbus-user-session
          # The rootless tools of Docker (dockerd-rootless.sh, rootlesskit): the runner holds the daemon, not them. Its
          # static release, checked against the digest written here.
          curl -fsSL -o /tmp/rootless-extras.tgz \
            https://download.docker.com/linux/static/stable/x86_64/docker-rootless-extras-28.0.4.tgz
          echo "0d0c2680d924671df0ac33d53dd71f410dfb253fb4fa5e8a0a231951234781c9  /tmp/rootless-extras.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/rootless"
          tar -xzf /tmp/rootless-extras.tgz -C "$HOME/.local/rootless" --strip-components 1
          grep -q "^$USER:" /etc/subuid || echo "$USER:100000:65536" | sudo tee -a /etc/subuid
          grep -q "^$USER:" /etc/subgid || echo "$USER:100000:65536" | sudo tee -a /etc/subgid
          # Ubuntu 24.04 refuses a user namespace to a program without an AppArmor profile that allows it. Lifted here
          # for every program of this throwaway runner, as gate.yml does for bubblewrap. It is not the way to run a
          # rootless daemon on a host that lasts: there, an AppArmor profile gives `userns` to rootlesskit alone
          # (Docker's documentation of the rootless mode). With the restriction on, the escape attack that makes a
          # nested user namespace would fail because of the host, and prove nothing of the container.
          echo "userns restriction before: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          for i in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          systemd-run --user --unit aos-dockerd --property Delegate=yes \
            --setenv=PATH="$HOME/.local/rootless:$PATH" \
            "$HOME/.local/rootless/dockerd-rootless.sh" --iptables=false --ip6tables=false --bridge=none
          ROOTLESS="unix://$XDG_RUNTIME_DIR/docker.sock"
          for i in $(seq 1 60); do docker -H "$ROOTLESS" info >/dev/null 2>&1 && break; sleep 1; done
          docker -H "$ROOTLESS" info --format 'rootless daemon: server {{.ServerVersion}} ; security {{json .SecurityOptions}} ; cgroup {{.CgroupDriver}} v{{.CgroupVersion}}'
          docker -H unix:///var/run/docker.sock info --format 'daemon with root: server {{.ServerVersion}} ; security {{json .SecurityOptions}}'
          echo "tools: $("$HOME/.local/rootless/rootlesskit" --version) ; $(slirp4netns --version | head -1) ; uidmap $(dpkg-query -W -f='${Version}' uidmap)"
          echo "DOCKER_HOST=$ROOTLESS" >> "$GITHUB_ENV"

      # The gateway never downloads an image: its operator does, by the digest.
      - name: The image of the sandboxes, by its digest
        run: |
          IMAGE="$(node -p "require('./rootless/image.json').image")"
          docker pull "$IMAGE"
          docker image inspect --format 'image: {{index .RepoDigests 0}} {{.Os}}/{{.Architecture}}' "$IMAGE"

      - name: Install (lockfile, scripts disabled)
        run: npm ci --ignore-scripts

      - name: Rootless scenarios
        run: npm run test:rootless

      - name: What the daemon said, when a scenario failed
        if: failure()
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user status aos-dockerd --no-pager | head -20 || true
          journalctl --user -u aos-dockerd --no-pager | tail -80 || true
          docker ps -a || true
